# Render "Blueprint": the Honor web service (website + API in one) and its database.
# See docs/DEPLOYMENT.md. Paid plans are used because free web services fall asleep
# and free databases are deleted after a few weeks.
# Values marked `sync: false` are typed into the Render dashboard (never in this file).

databases:
  - name: honor-db
    plan: basic-256mb
    databaseName: honor
    user: honor

services:
  - type: web
    name: honor
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: honor-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # First run only: the first parent account. Change the password in the app's Admin page afterwards.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Admin
